name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - name: Bake in the Spotify Client ID
        shell: bash
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
        run: |
          node -e "require('fs').writeFileSync('src/default-config.js', 'module.exports = { clientId: ' + JSON.stringify(process.env.SPOTIFY_CLIENT_ID) + ', redirectPort: 8888 };\n')"

      - run: npm run dist

      - name: Create GitHub Release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ github.ref_name }}" dist/*.exe --title "${{ github.ref_name }}" --generate-notes
