<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; script-src 'self';" />
    <title>Spotify Lyrics</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="panel">
      <header class="header">
        <div class="track-info">
          <div class="title" id="track-title">Spotify Lyrics</div>
          <div class="artist" id="track-artist"></div>
        </div>
        <div class="controls">
          <button id="login-btn" class="icon-btn" title="Connect to Spotify">⏻</button>
          <button id="hide-btn" class="icon-btn" title="Hide">×</button>
        </div>
      </header>

      <div class="lyrics-wrap" id="lyrics-wrap">
        <div class="state-message" id="state-message">Connect your Spotify account to get started</div>
        <div class="lyrics" id="lyrics"></div>
      </div>
    </div>

    <script src="renderer.js"></script>
  </body>
</html>
