<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; script-src 'self';" />
    <title>Spotify Lyrics</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="panel">
      <header class="header">
        <div class="track-info">
          <div class="title" id="track-title">Spotify Lyrics</div>
          <div class="artist" id="track-artist"></div>
        </div>
        <div class="controls">
          <button id="login-btn" class="icon-btn" title="Connect to Spotify">⏻</button>
          <div class="theme-picker">
            <button id="theme-btn" class="icon-btn" title="Background">🎨</button>
            <div class="theme-popover hidden" id="theme-popover">
              <button class="swatch swatch-dark" data-theme="dark" title="Dark"></button>
              <button class="swatch swatch-midnight" data-theme="midnight" title="Midnight"></button>
              <button class="swatch swatch-forest" data-theme="forest" title="Forest"></button>
              <button class="swatch swatch-wine" data-theme="wine" title="Wine"></button>
              <button class="swatch swatch-light" data-theme="light" title="Light"></button>
            </div>
          </div>
          <button id="minimize-btn" class="icon-btn" title="Minimize">–</button>
          <button id="close-btn" class="icon-btn" title="Quit">×</button>
        </div>
      </header>

      <div class="lyrics-wrap" id="lyrics-wrap">
        <div class="state-message" id="state-message">Connect your Spotify account to get started</div>
        <div class="lyrics" id="lyrics"></div>
      </div>

      <div class="toast hidden" id="toast"></div>

      <footer class="player-controls">
        <button id="prev-btn" class="icon-btn control-btn" title="Previous">⏮</button>
        <button id="play-pause-btn" class="icon-btn control-btn" title="Play/Pause">▶</button>
        <button id="next-btn" class="icon-btn control-btn" title="Next">⏭</button>
      </footer>
    </div>

    <script src="renderer.js"></script>
  </body>
</html>
